          type: string
          enum: [bigquery, no_credentials, no_data_yet, error]
          example: "bigquery"
        sessionsYesterday:
          type: integer
          example: 5432
          description: Session count from yesterday (GA4)
        syncedAt:
          type: integer
          format: unix-timestamp
          example: 1719457200
          description: Sync timestamp in seconds
      required: [ok, source, syncedAt]

x-changelog: |
  ## Version History

  ### v2.2.0 (2026-10-04)
  - **Fixed**: paths aligned with the worker code (src/index.ts): auth routes are served under /admin/auth/* (users and password, not create-user and change-password), /admin/metrics/networks is /admin/metrics/network, and the server URL is the real workers.dev host.
  - **Known gaps** (routes in code without schema here): see "Mapa de rotas" in docs/technical/admin-api-schema.md.

  ### v2.1.0 (2026-07-26) — Refs #1446
  - **Added**: /admin/diagnostic/* proxy to signallq-diagnostic-worker (schemas in ./signallq-diagnostic-worker.yaml).

  ### v2.0.0 (2026-06-27)
  - Documented /auth, /ingest, /admin/metrics, /admin/integrations/firebase; consolidated analytics paths under /admin/metrics/*; removed the /v1 prefix.

x-implementation-notes: |
  ## Implementation Notes

  - **No version prefix**: Actual Worker uses /admin/*, /admin/auth/*, /ingest/* directly (no /v1)
  - **Auth**: 3 distinct schemes (session for /admin/*, Bearer for /ingest/*, Bearer legacy for /health)
  - **Rate limiting**: Applied to /admin/auth/* endpoints only (IP-based, 5 attempts/15min)
  - **INGEST_KEY scope**: Write-only /ingest/* (cannot read admin data, reduces APK compromise blast radius)
  - **Database**: D1 (Cloudflare) for admin data, Firebase for analytics
  - **Async operations**: Some endpoints like /admin/integrations/firebase/sync are fire-and-forget
  - **Response schemas**: See /components/schemas/ for complete data models
  - **CORS**: Enabled; credentials allowed via Set-Cookie (httpOnly, Secure, SameSite=None)
