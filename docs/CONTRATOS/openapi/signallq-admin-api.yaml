  # GH#1478 (Épico #1347, Feature F2) — backend admin de Feature Flags / Firebase Remote Config.
  # Distinto de /admin/feature-flags acima (SIG-13, mecanismo local simples sem Firebase). Todas
  # as rotas de escrita (publish/rollback/feature-flags/sync sem ?dryRun=true) exigem role=admin
  # e validam contra o catálogo canônico do Consumer (`android/core/featureflags/.../
  # consumer-catalog.json`, issue #1477) — nunca aceitam chave fora do catálogo.
  /admin/firebase/remote-config:
    get:
      summary: Lê o template atual do Firebase Remote Config + ETag (passthrough)
      operationId: getRemoteConfigTemplate
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Template + ETag
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId: { type: string }
                  etag: { type: string, nullable: true }
                  parameters: { type: object }
                  parameterGroups: { type: object }
                  conditions: { type: array, items: {} }
                  version: { type: object, nullable: true }
        '401': { $ref: '#/components/responses/401Error' }
        '503': { description: FIREBASE_CLIENT_EMAIL/FIREBASE_PRIVATE_KEY não configurados }

  /admin/firebase/remote-config/versions:
    get:
      summary: Histórico de versões do template (passthrough remoteConfig:listVersions)
      operationId: listRemoteConfigVersions
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 300, default: 10 }
        - name: pageToken
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista de versões
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: {} }
                  nextPageToken: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/401Error' }

  /admin/firebase/remote-config/validate:
    post:
      summary: Valida um patch de parâmetros contra o catálogo, sem publicar
      operationId: validateRemoteConfigPatch
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoteConfigPublishBody' }
      responses:
        '200':
          description: Sempre 200 quando o JSON é bem formado — erros de conteúdo vêm em `errors[]`
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  errors: { type: array, items: { type: string } }
                  warnings: { type: array, items: { type: string } }
        '400': { description: body malformado (JSON inválido ou "parameters" não é objeto) }
        '401': { $ref: '#/components/responses/401Error' }

  /admin/firebase/remote-config/publish:
    post:
      summary: Publica um patch de parâmetros (merge preservando não gerenciados, ETag obrigatório)
      operationId: publishRemoteConfigPatch
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag do template atual (proteção contra sobrescrita concorrente)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoteConfigPublishBody' }
      responses:
        '200':
          description: Publicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  templateVersion: { type: string, nullable: true }
                  etag: { type: string, nullable: true }
                  updatedKeys: { type: array, items: { type: string } }
        '400':
          description: >-
            Validação contra o catálogo falhou (flag inexistente, não adminManaged, dependência
            inválida, tipo incompatível, ou "reason" ausente para flag HIGH/CRITICAL)
        '401': { $ref: '#/components/responses/401Error' }
        '403': { $ref: '#/components/responses/403Error' }
        '409': { description: Conflito de ETag — template mudou desde a última leitura }
        '429': { description: Rate limit dedicado de escrita excedido (20 req/10min por usuário) }

  /admin/firebase/remote-config/rollback:
    post:
      summary: Reverte o template pra uma versão anterior (remoteConfig:rollback)
      operationId: rollbackRemoteConfig
      tags: [admin]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetVersion, reason]
              properties:
                targetVersion:
                  oneOf: [{ type: string }, { type: integer }]
                reason:
                  type: string
                  minLength: 3
                  description: Confirmação reforçada — sempre obrigatória em rollback
      responses:
        '200':
          description: Revertido
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  templateVersion: { type: string, nullable: true }
                  etag: { type: string, nullable: true }
        '400': { description: targetVersion ou reason ausente/inválido }
        '401': { $ref: '#/components/responses/401Error' }
        '403': { $ref: '#/components/responses/403Error' }
        '429': { description: Rate limit dedicado de escrita excedido }

  /admin/firebase/feature-flags/catalog:
    get:
      summary: Serve o catálogo canônico de Feature Flags do Consumer (#1477) pro Admin consumir
      operationId: getFeatureFlagCatalog
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Catálogo completo — funciona mesmo sem credencial Firebase configurada
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemaVersion: { type: string }
                  flagCount: { type: integer }
                  adminManagedCount: { type: integer }
                  flags: { type: array, items: {} }
        '401': { $ref: '#/components/responses/401Error' }

  /admin/firebase/feature-flags/sync:
    post:
      summary: >-
        Sincroniza catálogo → Firebase: cria parâmetros adminManaged ausentes, detecta órfãos e
        divergências de tipo. Nunca sobrescreve ou apaga parâmetro já existente.
      operationId: syncFeatureFlagsCatalog
      tags: [admin]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: dryRun
          in: query
          description: "true = só calcula o diff, sem publicar no Firebase"
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Diff calculado (dryRun) ou aplicado (execução real)
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun: { type: boolean }
                  toCreate: { type: array, items: {} }
                  created: { type: array, items: { type: string } }
                  orphans:
                    type: array
                    items: { type: string }
                    description: Parâmetros no Firebase sem entrada no catálogo
                  divergent:
                    type: array
                    items: { type: string }
                    description: Chaves do catálogo com valueType divergente no Firebase (só reportado, nunca corrigido automaticamente)
        '401': { $ref: '#/components/responses/401Error' }
        '403': { description: Execução real (dryRun=false) exige role=admin }
        '429': { description: Rate limit dedicado de escrita excedido (não se aplica a dryRun=true) }

  # Refs #1446 — proxy transparente pro signallq-diagnostic-worker (service binding, ver
  # proxyDiagnosticAdmin em src/index.ts). Autentica com a MESMA sessão de cookie de /admin/* acima
  # (cookieAuth) — o Console nunca fala direto com o diagnostic-worker, então não existe um segundo
  # esquema de auth aqui. Status/corpo são repassados sem transformação; os schemas completos (não
  # duplicados aqui) vivem no contrato de origem: ./signallq-diagnostic-worker.yaml.
  /admin/diagnostic/rulesets:
    get:
      summary: "[Proxy] Lista rulesets (versões) do motor de diagnóstico"
      operationId: proxyListRulesets
      tags:
        - admin
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Repassado sem transformação do signallq-diagnostic-worker
          content:
            application/json:
              schema:
                $ref: './signallq-diagnostic-worker.yaml#/components/schemas/RulesetSummary'
        '401':
          $ref: '#/components/responses/401Error'
        '502':
          description: Service binding ou DIAGNOSTIC_PROXY_SECRET não configurados no admin-worker
    post:
      summary: "[Proxy] Cria um rascunho (DRAFT) de ruleset"
      operationId: proxyCreateRulesetDraft
      tags:
        - admin
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './signallq-diagnostic-worker.yaml#/components/schemas/DiagnosticRuleset'
      responses:
        '201':
          description: Repassado sem transformação do signallq-diagnostic-worker
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

  /admin/diagnostic/rulesets/{version}:
    get:
      summary: "[Proxy] Detalhe completo de um ruleset (inclui rules_json)"
      operationId: proxyGetRuleset
      tags:
        - admin
      security:
        - cookieAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Repassado sem transformação do signallq-diagnostic-worker
          content:
            application/json:
              schema:
                $ref: './signallq-diagnostic-worker.yaml#/components/schemas/DiagnosticRuleset'
        '401':
          $ref: '#/components/responses/401Error'
        '404':
          description: Ruleset não encontrado

  /admin/diagnostic/rulesets/validate:
    post:
      summary: "[Proxy] Valida um ruleset sem persistir (não depende de uma versão já existente)"
      operationId: proxyValidateRuleset
      tags:
        - admin
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './signallq-diagnostic-worker.yaml#/components/schemas/DiagnosticRuleset'
      responses:
        '200':
          description: Repassado sem transformação do signallq-diagnostic-worker
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

  /admin/diagnostic/simulate:
    post:
      summary: "[Proxy] Avalia um snapshot contra um ruleset arbitrário (sem persistir)"
