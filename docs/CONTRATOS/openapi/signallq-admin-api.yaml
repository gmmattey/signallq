          description: Repassado sem transformação do signallq-diagnostic-worker
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '409':
          description: version não é o ruleset PUBLISHED atual (ou não existe)

  /admin/diagnostic/rulesets/{version}/rollback:
    post:
      summary: "[Proxy] Reverte um ruleset publicado (restaura a versão anterior, se existir)"
      operationId: proxyRollbackRuleset
      tags:
