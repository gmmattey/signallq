          application/json:
            schema:
              type: object
              properties:
                snapshot:
                  $ref: './signallq-diagnostic-worker.yaml#/components/schemas/DiagnosticSnapshot'
                ruleset:
                  $ref: './signallq-diagnostic-worker.yaml#/components/schemas/DiagnosticRuleset'
      responses:
        '200':
          description: Repassado sem transformação do signallq-diagnostic-worker
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

  /admin/diagnostic/rulesets/{version}/publish:
    post:
      summary: "[Proxy] Publica um ruleset (torna-o o ativo; despublica o anterior)"
      operationId: proxyPublishRuleset
      tags:
        - admin
      security:
        - cookieAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './signallq-diagnostic-worker.yaml#/components/schemas/RolloutConfigInput'
      responses:
        '200':
          description: Repassado sem transformação do signallq-diagnostic-worker
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

  /admin/diagnostic/rulesets/{version}/rollout:
    post:
      summary: "[Proxy] Atualiza só o rollout (percentual + segmentação) do ruleset PUBLISHED atual"
      operationId: proxyUpdateRolloutConfig
      tags:
        - admin
