        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Repassado sem transformação do signallq-diagnostic-worker
        '401':
          $ref: '#/components/responses/401Error'

  /admin/diagnostic/divergences:
    get:
      summary: "[Proxy] Lista registros de divergência do shadow mode e um resumo por classificação"
      operationId: proxyListDiagnosticDivergences
      tags:
        - admin
      security:
        - cookieAuth: []
