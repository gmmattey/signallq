        - name: classification
          in: query
          required: false
          schema:
            type: string
            enum: [EXACT_MATCH, EQUIVALENT_RESULT, MINOR_DIVERGENCE, MAJOR_DIVERGENCE, REMOTE_ERROR, LOCAL_ERROR]
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Repassado sem transformação do signallq-diagnostic-worker
          content:
            application/json:
              schema:
                $ref: './signallq-diagnostic-worker.yaml#/components/schemas/DiagnosticDivergenceRecord'
        '401':
          $ref: '#/components/responses/401Error'

  /health:
    get:
      summary: Worker health check
      operationId: health
      tags:
        - health
      security:
        - adminSecretAuth: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/401Error'

components:
  parameters:
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [24h, 7d, 30d, 90d]
      required: false
    StartDate:
      name: startDate
      in: query
      schema:
        type: string
        format: date
      required: false
    EndDate:
      name: endDate
      in: query
      schema:
        type: string
        format: date
      required: false
    Environment:
      name: environment
      in: query
      schema:
        type: string
        enum: [production, staging]
      required: false
    Country:
      name: country
      in: query
      schema:
        type: string
      required: false
    State:
      name: state
      in: query
      schema:
        type: string
      required: false
    City:
      name: city
      in: query
      schema:
        type: string
      required: false
    AppVersion:
      name: appVersion
      in: query
      schema:
        type: string
      required: false
    NetworkType:
      name: networkType
      in: query
      schema:
        type: string
      required: false
    Operator:
      name: operator
      in: query
      schema:
        type: string
      required: false
    AiProvider:
      name: aiProvider
      in: query
      schema:
        type: string
      required: false

  responses:
    400Error:
      description: The client specified unresolvable query criteria
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    401Error:
      description: Admin session cookies expired or unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    403Error:
      description: Authenticated but insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    429Error:
      description: Rate limited (too many login attempts)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Muitas tentativas. Tente novamente em 15 minutos."

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        HTTPOnly session cookie (SIG-136).

        **Authentication Flow**:
        1. POST /admin/auth/login with email + password
        2. Response includes Set-Cookie with 7-day session token
        3. Subsequent requests: browser automatically sends session cookie
        4. POST /admin/auth/logout to revoke session

        **Password Security**: PBKDF2-SHA256 (100k iterations, pepper from ADMIN_AUTH_PEPPER)

        **Rate Limiting**: Max 5 login attempts per IP per 15 minutes

    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token for /ingest/* endpoints (app-only).

        **Token**: INGEST_KEY (from wrangler.toml secrets)

        **Scope**: Write-only, limited to POST /ingest/diagnostic, /ingest/ai-usage, /ingest/analytics

        **Lifetime**: Indefinite (rotate manually if compromised)

        **Purpose**: Reduces blast radius if APK is reverse-engineered. INGEST_KEY can only POST measurements, cannot read admin data.

    adminSecretAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token for /health endpoint (legacy, retrocompat only).

        **Token**: ADMIN_SECRET (from wrangler.toml secrets)

        **Status**: Deprecated (use session auth for /admin/*, Bearer INGEST_KEY for /ingest/*)

  schemas:
    # GH#1478 — patch de parâmetros usado por validate/publish. Toda chave precisa existir no
    # catálogo canônico (`adminManaged: true`) — ver src/featureFlagCatalog.ts.
    RemoteConfigPublishBody:
      type: object
      required: [parameters]
      properties:
        parameters:
          type: object
          description: "Mapa { chave_do_catalogo: { value } } — chave inexistente no catálogo é rejeitada"
          additionalProperties:
            type: object
            required: [value]
            properties:
              value:
                oneOf: [{ type: boolean }, { type: string }, { type: number }]
        reason:
          type: string
          minLength: 3
          description: >-
            Obrigatório quando alguma flag tocada tem criticality HIGH ou CRITICAL (confirmação
            reforçada) — opcional caso contrário.

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
      required: [code, message]

    OverviewMetricsResponse:
      type: object
      properties:
        totalDiagnosticsToday:
          type: integer
        activeUsersToday:
          type: integer
        estimatedAiCostToday:
          type: number
        totalDownloadsToday:
          type: integer
        averageCrashFreeUsersRate:
          type: number
        liveAppVersionInProduction:
          type: string
        activeInstallsCount:
          type: integer
      required: [totalDiagnosticsToday, activeUsersToday, estimatedAiCostToday, totalDownloadsToday, averageCrashFreeUsersRate, liveAppVersionInProduction, activeInstallsCount]

    DiagnosticsMetricsResponse:
      type: object
      properties:
        totalTestsCount:
          type: integer
        criticalIssuesCount:
          type: integer
        attentionIssuesCount:
          type: integer
        averageDownloadMbps:
          type: number
        averageUploadMbps:
          type: number
        averageLatencyMs:
          type: number
        averageScore:
          type: number
        averageJitterMs:
          type: number
        averagePacketLossPercentage:
          type: number
      required: [totalTestsCount, criticalIssuesCount, attentionIssuesCount, averageScore]

    NetworkMetricsResponse:
      type: object
      properties:
        wifiAnalysedCount:
          type: integer
        cellTowersCount:
          type: integer
        physicalBadSignalRate:
          type: number
        mediumAverages:
          type: array
          items:
            type: object
            properties:
