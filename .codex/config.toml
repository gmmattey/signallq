# Configuração de projeto do Codex para o SignallQ.
# AGENTS.md é a entrada; docs/05-governanca-e-fluxo-de-trabalho.md contém a autoridade normativa.

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
