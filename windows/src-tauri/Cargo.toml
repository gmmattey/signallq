[package]
name = "signallq-windows"
version = "0.2.0"
description = "Diagnostico de conectividade SignallQ para Windows"
edition = "2021"

[lib]
name = "signallq_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
dirs = "6.0.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2"
tokio = { version = "1.48.0", features = ["net", "time", "macros", "sync", "process"] }
uuid = { version = "1.18.1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock"] }
